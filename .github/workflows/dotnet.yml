name: Shared .NET core
'on':
  workflow_call:
    inputs:
      groups:
        required: true
        type: string
      windows-matrix:
        required: true
        type: string
      macos:
        required: true
        type: boolean
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      NUGET_PACKAGES: ${{ github.workspace }}/.cache/nuget
      MAY_CI_GROUPS: ${{ inputs.groups }}
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.400
        cache: true
        cache-dependency-path: desktop/**/packages.lock.json
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: |-
          requirements-test.txt
          requirements-client-merge.txt
    - run: python -m pip install --disable-pip-version-check -r requirements-test.txt paramiko==5.0.0
    - name: Run dotnet
      run: python scripts/ci/run.py --suite dotnet
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: timing-core-linux
        path: .tmp/ci/dotnet.json
        if-no-files-found: ignore
        retention-days: 14
    name: Linux shared behavior
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      NUGET_PACKAGES: ${{ github.workspace }}/.cache/nuget
      MAY_CI_GROUPS: ${{ toJSON(matrix.groups) }}
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.400
        cache: true
        cache-dependency-path: desktop/**/packages.lock.json
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: |-
          requirements-test.txt
          requirements-client-merge.txt
    - uses: actions/cache@v4
      with:
        path: |-
          .cache/client-cores
          .cache/dotnet-client-cores
          .cache/ci-xray
        key: verified-test-cores-${{ runner.os }}-${{ hashFiles('vendor/test-cores/windows-amd64/*.json', 'config/versions.json', 'scripts/ci/Initialize-ClientCores.ps1') }}
    - run: python -m pip install --disable-pip-version-check -r requirements-test.txt paramiko==5.0.0
    - name: Run dotnet
      run: python scripts/ci/run.py --suite dotnet
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: timing-core-windows-${{ matrix.shard }}
        path: .tmp/ci/dotnet.json
        if-no-files-found: ignore
        retention-days: 14
    name: Windows ${{ matrix.shard }}
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix: ${{ fromJSON(inputs.windows-matrix) }}
  macos:
    runs-on: macos-latest
    timeout-minutes: 18
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      NUGET_PACKAGES: ${{ github.workspace }}/.cache/nuget
      MAY_CI_GROUPS: ${{ inputs.groups }}
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.400
        cache: true
        cache-dependency-path: desktop/**/packages.lock.json
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: |-
          requirements-test.txt
          requirements-client-merge.txt
    - run: python -m pip install --disable-pip-version-check -r requirements-test.txt paramiko==5.0.0
    - name: Run dotnet
      run: python scripts/ci/run.py --suite dotnet
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: timing-core-macos
        path: .tmp/ci/dotnet.json
        if-no-files-found: ignore
        retention-days: 14
    name: macOS full compatibility
    if: inputs.macos
