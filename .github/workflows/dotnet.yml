name: Shared .NET core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      MAY_TEST_SSH_PYTHON: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check paramiko==5.0.0
      - run: python tests/test_tcp_forwarding.py
      - run: python tests/test_udp_forwarding.py
      - run: dotnet restore desktop/May.VpsDeploy.Tests/May.VpsDeploy.Tests.csproj --locked-mode
      - run: dotnet run --project desktop/May.VpsDeploy.Tests/May.VpsDeploy.Tests.csproj -c Release --no-restore -- "${{ github.workspace }}"
      - if: runner.os == 'Windows'
        run: dotnet restore desktop/May.VpsDeploy.Windows.Tests/May.VpsDeploy.Windows.Tests.csproj --locked-mode
      - if: runner.os == 'Windows'
        run: dotnet run --project desktop/May.VpsDeploy.Windows.Tests/May.VpsDeploy.Windows.Tests.csproj -c Release --no-restore -- "${{ github.workspace }}"
