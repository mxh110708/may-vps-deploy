name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  debian-remote-contract:
    name: Debian ${{ matrix.debian }} VPS remote contract
    runs-on: ubuntu-latest
    strategy:
      matrix:
        debian: ['12', '13']
    container: debian:${{ matrix.debian }}-slim
    steps:
      - name: Install checkout prerequisites
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git
      - uses: actions/checkout@v5
      - name: Validate Debian VPS package and OpenSSH contract
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            bash ca-certificates curl dnsutils iproute2 jq nftables nginx openssh-server \
            openssl python3 python3-venv python3-certbot-dns-cloudflare sudo systemd-timesyncd tar unzip util-linux
          . /etc/os-release
          [[ "$ID" == 'debian' && "$VERSION_ID" == '${{ matrix.debian }}' ]]
          install -d -m 0755 /run/sshd
          sshd -t
          for command in bash curl dig ip jq nft nginx sshd openssl python3 sudo tar unzip flock; do
            command -v "$command" >/dev/null
          done
          for file in assets/remote/*.sh; do
            bash -n "$file"
          done
          python3 tests/test_remote_transactions.py --bash /bin/bash
          python3 tests/test_komari_lifecycle.py --bash /bin/bash
          python3 tests/test_health_audit.py
          python3 tests/test_network_runtime.py
          python3 tests/test_network_audit.py
          python3 tests/test_bbr_kernel.py
          python3 tests/test_kernel_prebuild.py
          python3 tests/test_component_releases.py
          python3 tests/test_initial_release_pin.py
          python3 tests/test_tunnel_public_access.py
          python3 tests/test_certbot_source.py
          python3 -m venv .tmp/client-test-runtime
          .tmp/client-test-runtime/bin/python -m pip install --disable-pip-version-check -r requirements-client-merge.txt
          .tmp/client-test-runtime/bin/python tests/test_review_repairs.py --bash /bin/bash
          .tmp/client-test-runtime/bin/python tests/test_google_client_policy.py
          python3 tests/test_scoped_rollback.py --bash /bin/bash
          python3 tests/test_component_installation.py --bash /bin/bash
          python3 tests/test_import_contracts.py --bash /bin/bash
          python3 tests/test_linux_core_upgrade.py
          python3 scripts/check-kernel-prebuilt.py

  powershell:
    name: Windows client checks (Python ${{ matrix.python }}, PowerShell ${{ matrix.powershell }})
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
        powershell: ['runner', '7.4.20']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-client-merge.txt
      - name: Prepare isolated minimum PowerShell
        if: matrix.powershell != 'runner'
        shell: pwsh
        run: |
          $runtime = ./scripts/Initialize-PowerShell74.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'mxh-powershell-7.4.20')
          $runtime | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify selected PowerShell
        shell: pwsh
        env:
          EXPECTED_POWERSHELL: ${{ matrix.powershell }}
        run: |
          $PSVersionTable.PSVersion
          if ($env:EXPECTED_POWERSHELL -ne 'runner' -and $PSVersionTable.PSVersion.ToString() -ne $env:EXPECTED_POWERSHELL) { throw 'Wrong PowerShell runtime selected.' }
      - name: Install pinned client-config dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r ./requirements-client-merge.txt
      - name: Run project tests
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./tests/Run-Tests.ps1 -ProjectRoot $PWD
      - name: Validate bundled client cores and generated configs
        shell: pwsh
        run: |
          Import-Module ./src/VpsDeploy.Core.psm1 -Force
          $mihomo = Get-VpsBundledClientCore -ProjectRoot $PWD -Core mihomo
          $singBox = Get-VpsBundledClientCore -ProjectRoot $PWD -Core sing-box
          if (-not (Test-Path $mihomo)) { throw 'bundled Mihomo validation failed' }
          ./tests/Test-SingBoxConfig.ps1 -ProjectRoot $PWD -SingBoxPath $singBox
          ./tests/Test-ClientCompatibility.ps1 -ProjectRoot $PWD
      - uses: actions/setup-dotnet@v5
        if: matrix.python == '3.13' && matrix.powershell == 'runner'
        with:
          dotnet-version: 10.0.400
      - name: Build native EXE and validate installer lifecycle
        if: matrix.python == '3.13' && matrix.powershell == 'runner'
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./tests/Test-DesktopInstaller.ps1 -ProjectRoot $PWD

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/remote/*.sh; do
            bash -n "$file"
          done
      - name: ShellCheck
        shell: bash
        run: shellcheck --severity=warning assets/remote/*.sh
      - name: Validate restricted nftables template
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables
          sudo env \
            VPS_PARAM_TCP_PORTS='30124,31235' \
            VPS_PARAM_RESTRICTED_PORT='33456' \
            VPS_PARAM_ALLOWED_IPV4S='192.0.2.30,192.0.2.31' \
            VPS_PARAM_ALLOWED_IPV6S='2001:db8::30' \
            VPS_PARAM_CHECK_ONLY='true' \
            bash assets/remote/nftables-apply.sh
      - name: Validate conservative adaptive network template
        shell: bash
        run: |
          for role in RealityEntry AnyTlsEntry; do
            env \
              VPS_PARAM_ROLE="$role" \
              VPS_PARAM_MEMORY_KIB='1048576' \
              VPS_PARAM_MODE='AdaptiveConservative' \
              VPS_PARAM_BANDWIDTH_MBPS='100' \
              VPS_PARAM_REFERENCE_RTT_MS='160' \
              VPS_PARAM_BUFFER_TARGET_BYTES='4000000' \
              VPS_PARAM_BUFFER_CAP_BYTES='8388608' \
              VPS_PARAM_QUEUE_FLOOR='1024' \
              VPS_PARAM_PROFILE='entry-small-adaptive' \
              VPS_PARAM_CHECK_ONLY='true' \
              bash assets/remote/network-tuning.sh | grep -Fx 'VPSDEPLOY_NETWORK_CHECK_OK'
          done
